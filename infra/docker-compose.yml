services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: nonglac_db
    restart: always
    environment:
      POSTGRES_DB: nonglac_db
      POSTGRES_USER: nonglac_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-supplement.sql:/docker-entrypoint-initdb.d/02-supplement.sql:ro
      - ./postgres/03-seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./postgres/04-otp.sql:/docker-entrypoint-initdb.d/04-otp.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonglac_user -d nonglac_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nonglac_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.7.0
    container_name: nonglac_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  postgres_data:
  redis_data:
  emqx_data:
